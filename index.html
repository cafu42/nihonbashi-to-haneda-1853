 {y:"1853",t:"江戸の出口、品川宿",k:"1853〜1867　幕末・開国",
  s:"東海道は日本橋を出て海沿いを南へ下ります。高輪大木戸が江戸の出入口で、その先が東海道最初の宿場・品川宿。道のすぐ脇はもう海で、品川から大森の遠浅では海苔が育てられていました。ペリー来航を受けて、品川沖には台場が築かれます。"},

 {y:"1900",t:"電車と埋立のはじまり",k:"1900〜1922　明治末〜大正",

 {y:"1923",t:"震災、埋立、そして飛行場",k:"1923〜1944　震災復興から戦時へ",

 {y:"1945",t:"接収された空港",k:"1945〜1956　戦後",
  s:"敗戦後、羽田は連合国軍に接収され「ハネダ・エアベース」に。周辺の住民には48時間以内の立ち退きが命じられました。1952年に大部分が返還されて「東京国際空港」と改称。大井には競馬場ができます。港の埠頭も接収され、沖の埋立はしばらく止まりました。"},
 {y:"1958",t:"五輪インフラが湾岸に集まる",k:"1957〜1970　高度成長期",

 {y:"1971",t:"コンテナ埠頭と沖へ出る空港",k:"1971〜1992　海がさらに遠くなる",

    d.innerHTML=`<span class="yl">${s.y}</span><span class="ys">’${s.y.slice(2)}</span>`;d.setAttribute("aria-label",`${s.y} ${s.t}へ`);
    d.addEventListener("click",e=>{e.stopPropagation();seek(ERA0[k]+D.change);pause()});segs.appendChild(d)})}
function setPlaying(v){playing=v;playB.textContent=v?"❚❚ 一時停止":"▶ 再生";playB.setAttribute("aria-pressed",v);last=performance.now()}
function pause(){setPlaying(false)}
playB.onclick=()=>{if(!playing&&t>=TOTAL-.01)t=0;setPlaying(!playing)};
function seek(x){t=clamp(x,0,TOTAL);dirty=true}
let scrubbing=false;
function scrubTo(e){const r=$("track").getBoundingClientRect();seek((e.clientX-r.left)/r.width*TOTAL)}
$("track").addEventListener("pointerdown",e=>{scrubbing=true;$("track").setPointerCapture(e.pointerId);pause();scrubTo(e)});
$("track").addEventListener("pointermove",e=>{if(scrubbing)scrubTo(e)});
$("track").addEventListener("pointerup",()=>scrubbing=false);
cv.addEventListener("pointerdown",()=>{if(playing){holding=true;badge.hidden=false}});
["pointerup","pointercancel","pointerleave"].forEach(ev=>cv.addEventListener(ev,()=>{if(holding){holding=false;badge.hidden=true;last=performance.now()}}));
document.addEventListener("keydown",e=>{if(e.code==="Space"&&e.target===document.body){e.preventDefault();playB.click()}});
window.addEventListener("resize",resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{readColors();dirty=true});

function updatePanel(i){
  const S_=STEPS[i];$("years").textContent=S_.y;$("title").textContent=S_.t;$("kicker").textContent=S_.k;$("story").textContent=S_.s;
  ["era","story","lm"].forEach(id=>{const e=$(id);e.classList.remove("fade");void e.offsetWidth;e.classList.add("fade")});
  const L=LM.filter(l=>l.s===i);
  $("lm").innerHTML=L.map(l=>`<li><b>${l.y}</b><span>${l.n}${l.note?`（${l.note}）`:""}</span><em>${l.h?l.h+"m":""}</em></li>`).join("");
  const G=LM.filter(l=>l.end===i&&l.gy);$("gonebox").hidden=!G.length;
  $("gone").innerHTML=G.map(l=>`<li><b>${l.gy}</b><span><s>${l.n}</s> — ${l.why}</span><em></em></li>`).join("");
  $("chips").innerHTML=MODES.filter(m=>m.s<=i).map(m=>{const g=m.end!=null&&i>=m.end;return `<span class="chip${m.s===i?" new":""}${g?" gone":""}">${m.n}</span>`}).join("");
  const T=LM.filter(l=>l.h&&l.s<=i).sort((a,b)=>b.h-a.h),base=Math.max(...TOWN[i]);
  $("stat").innerHTML=T.length?`いちばん高いのは <strong>${T[0].sn||T[0].n}（${T[0].h}m）</strong>。100m超の建物は <strong>${T.filter(x=>x.h>=100).length}</strong>棟。沿道のふつうの建物はおよそ <strong>${base}m</strong> まで。`
    :`高い建物はまだありません。沿道のふつうの建物はおよそ <strong>${base}m</strong>${base<=8?"（2階建ての町家）":""}。`;
  [...$("segs").children].forEach((b,k)=>{b.classList.toggle("on",k===i);b.classList.toggle("done",k<i)})}
let lastCap=null;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing&&!holding&&!scrubbing){t+=dt;dirty=true;if(t>=TOTAL){t=TOTAL;pause()}}
  if(dirty){const st=state(t);draw(st);
    if(st.i!==lastEra){lastEra=st.i;updatePanel(st.i)}
    if(st.cap!==lastCap){lastCap=st.cap;if(st.cap){capEl.textContent=st.cap;capEl.classList.add("show")}else capEl.classList.remove("show")}
    const f=t/TOTAL*100;fill.style.width=f+"%";knob.style.left=f+"%";dirty=playing&&!holding}
  requestAnimationFrame(frame)}
readColors();resize();buildScrub();
seek(D.change);setPlaying(false);
requestAnimationFrame(frame);
if(document.fonts)document.fonts.ready.then(()=>dirty=true);

</script>
</body>
</html>
